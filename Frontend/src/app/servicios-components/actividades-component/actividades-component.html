<section class="activities-section">
  <div class="activities-header">
    <h2 class="section-title">{{ 'ACTIVITIES.TITLE' | translate }}</h2>
    <h3 class="section-subtitle">
      {{ 'ACTIVITIES.SUBTITLE_1' | translate }}
      <span>{{ 'ACTIVITIES.SUBTITLE_2' | translate }}</span>
    </h3>
  </div>

  <div class="activities-container">
    <div class="activities-nav">
      <button
        *ngFor="let category of categories"
        class="nav-item"
        [class.active]="activeCategory === category.id"
        (click)="selectCategory(category.id)"
      >
        {{ category.nombre | translate }}
      </button>
    </div>

    <div class="carousel-container">
      <div class="main-carousel">
        <div class="main-image-container">
          <img
            [src]="getCurrentCategory().images?.[selectedImageIndex]"
            [alt]="getCurrentCategory()?.title | translate"
            class="main-image"
          />

          <div class="image-info-overlay">
            <div class="image-title">
              {{ getCurrentCategory().imageNames[selectedImageIndex] | translate }}
            </div>
            <button class="btn" (click)="explorarServicio()">
              {{ 'ACTIVITIES.EXPLORE' | translate }}
            </button>
          </div>

          <div class="thumbnail-container">
            <div
              *ngFor="let image of getCurrentCategory()?.images; let i = index"
              class="thumbnail-item"
              [class.active]="selectedImageIndex === i"
              (click)="selectImage(i)"
            >
              <img
                [src]="image"
                [alt]="(getCurrentCategory().title | translate) + ' ' + (i + 1)"
                class="thumbnail-image"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
