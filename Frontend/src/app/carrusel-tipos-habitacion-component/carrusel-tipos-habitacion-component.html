<section class="room-types-section">
  <div class="background-overlay">
    <div class="container">
      <h2 class="section-title">{{ 'ROOM_TYPES.TITLE' | translate }}</h2>

      <!-- Loading State -->
      <div *ngIf="loading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>{{ 'ROOM_TYPES.LOADING' | translate }}</p>
      </div>

      <div class="rooms-carousel" *ngIf="!loading">
        <!-- Contenedor principal del carrusel -->
        <div class="carousel-container">
          <!-- Botones de navegación -->
          <button class="carousel-nav prev" (click)="prevRoom()">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15 18L9 12L15 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <button class="carousel-nav next" (click)="nextRoom()">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 18L15 12L9 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <!-- Slides del carrusel -->
          <div
            class="carousel-slides"
            [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
          >
            <div class="carousel-slide" *ngFor="let room of rooms; let i = index">
              <div class="room-card">
                <div class="room-image">
                  <img [src]="room.images[0]" [alt]="getTranslatedName(i)" />
                  <div class="room-overlay">
                    <!-- ✅ Traducción dinámica de nombre -->
                    <h3 class="room-name">{{ getTranslatedName(i) }}</h3>

                    <!-- ✅ Traducción dinámica de descripción -->
                    <p class="room-description">{{ getTranslatedDescription(i) }}</p>

                    <!-- ✅ Traducción dinámica de características -->
                    <div class="room-features">
                      <span class="feature" *ngFor="let feature of getTranslatedFeatures(i)">
                        {{ feature }}
                      </span>
                    </div>

                    <div class="room-price">
                      <span class="price">
                        {{ 'ROOM_TYPES.FROM' | translate }} {{ room.price }}/{{
                          'ROOM_TYPES.PER_NIGHT' | translate
                        }}
                      </span>
                      <button class="book-btn">{{ 'ROOM_TYPES.BOOK_NOW' | translate }}</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Indicadores del carrusel -->
        <div class="carousel-indicators">
          <div
            *ngFor="let room of rooms; let i = index"
            class="indicator"
            [class.active]="i === currentIndex"
            (click)="goToRoom(i)"
          ></div>
        </div>
      </div>
    </div>
  </div>
</section>
