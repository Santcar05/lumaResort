<app-header-component></app-header-component>

<div class="login-background">
  <div class="overlay"></div>
  <div class="login-card animate-fade-in">
    <h2 class="title">{{ 'LOGIN.WELCOME' | translate }}</h2>
    <p class="subtitle">{{ 'LOGIN.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onLogin()">
      <div class="input-group">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="{{ 'LOGIN.EMAIL_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="{{ 'LOGIN.PASSWORD_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <button type="submit" class="white-btn animate-pulse" [disabled]="loading">
        {{ loading ? ('LOGIN.LOGGING_IN' | translate) : ('LOGIN.SUBMIT' | translate) }}
      </button>
    </form>

    <!-- Error State -->
    <div *ngIf="errorMsg && !loading" class="error-state">
      <div class="error-content">
        <div class="error-icon">⚠</div>
        <h3>{{ 'LOGIN.ERROR_TITLE' | translate }}</h3>
        <p>{{ errorMsg }}</p>
        <button class="btn-retry" (click)="onLogin()">
          <span class="retry-icon">↻</span>
          {{ 'LOGIN.RETRY' | translate }}
        </button>
      </div>
    </div>

    <p class="footer-text">
      {{ 'LOGIN.NO_ACCOUNT' | translate }}
      <a [routerLink]="['/signup']" class="link">{{ 'LOGIN.SIGN_UP' | translate }}</a>
    </p>
  </div>
</div>
