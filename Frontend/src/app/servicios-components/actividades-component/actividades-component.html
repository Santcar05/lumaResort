<section class="activities-section">
  <div class="activities-header">
    <h2 class="section-title">{{ 'ACTIVITIES.TITLE' | translate }}</h2>
    <h3 class="section-subtitle">
      {{ 'ACTIVITIES.SUBTITLE_1' | translate }}
      <span>{{ 'ACTIVITIES.SUBTITLE_2' | translate }}</span>
    </h3>
  </div>

  <!-- ========== LOADING STATE ========== -->
  <div
    *ngIf="isLoading"
    class="loading-container"
    style="min-height: 400px; display: flex; justify-content: center; align-items: center"
  >
    <p style="font-size: 1.2rem; color: #666">Cargando actividades...</p>
  </div>

  <!-- ========== NO DATA STATE ========== -->
  <div
    *ngIf="!isLoading && categories.length === 0"
    class="no-data-container"
    style="min-height: 400px; display: flex; justify-content: center; align-items: center"
  >
    <p style="font-size: 1.2rem; color: #666">No hay actividades disponibles en este momento.</p>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <div
    class="activities-container"
    *ngIf="!isLoading && categories.length > 0 && getCurrentCategory()"
  >
    <div class="activities-nav">
      <button
        *ngFor="let category of categories"
        class="nav-item"
        [class.active]="activeCategory === category.id"
        (click)="selectCategory(category.id)"
      >
        {{ category.nombre | translate }}
      </button>
    </div>

    <div class="carousel-container">
      <div class="main-carousel">
        <div class="main-image-container">
          <!-- ========== IMAGEN PRINCIPAL ========== -->
          <img
            *ngIf="
              getCurrentCategory() &&
              getCurrentCategory()!.images &&
              getCurrentCategory()!.images.length > 0
            "
            [src]="getCurrentCategory()!.images[selectedImageIndex]"
            [alt]="getCurrentCategory()!.imageNames?.[selectedImageIndex] || 'Actividad'"
            class="main-image"
          />

          <!-- ========== FALLBACK SI NO HAY IMAGEN ========== -->
          <div
            *ngIf="
              !getCurrentCategory() ||
              !getCurrentCategory()!.images ||
              getCurrentCategory()!.images.length === 0
            "
            class="no-image-placeholder"
            style="
              width: 100%;
              height: 500px;
              display: flex;
              justify-content: center;
              align-items: center;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              color: white;
              font-size: 1.5rem;
              border-radius: 15px;
            "
          >
            <p>No hay imágenes disponibles</p>
          </div>

          <!-- ========== OVERLAY DE INFORMACIÓN ========== -->
          <div
            class="image-info-overlay"
            *ngIf="
              getCurrentCategory() &&
              getCurrentCategory()!.imageNames &&
              getCurrentCategory()!.imageNames.length > 0
            "
          >
            <div class="image-title">
              {{ getCurrentCategory()!.imageNames[selectedImageIndex] | translate }}
            </div>
            <button class="btn" (click)="explorarServicio()">
              {{ 'ACTIVITIES.EXPLORE' | translate }}
            </button>
          </div>

          <!-- ========== THUMBNAILS ========== -->
          <div
            class="thumbnail-container"
            *ngIf="
              getCurrentCategory() &&
              getCurrentCategory()!.images &&
              getCurrentCategory()!.images.length > 1
            "
          >
            <div
              *ngFor="let image of getCurrentCategory()!.images; let i = index"
              class="thumbnail-item"
              [class.active]="selectedImageIndex === i"
              (click)="selectImage(i)"
            >
              <img
                [src]="image"
                [alt]="(getCurrentCategory()!.nombre || 'Actividad') + ' ' + (i + 1)"
                class="thumbnail-image"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
