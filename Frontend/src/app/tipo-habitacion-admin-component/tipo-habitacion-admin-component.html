<div class="admin-container">
  <!-- Notificación flotante -->
  <div
    class="notificacion"
    *ngIf="mostrarNotificacion"
    [ngClass]="{ exito: tipoNotificacion === 'exito', error: tipoNotificacion === 'error' }"
  >
    {{ mensaje }}
  </div>

  <h2 class="titulo">Tipos de Habitación</h2>

  <!-- Barra de búsqueda -->
  <div class="form-group" style="text-align: center; margin-bottom: 1.5rem">
    <input
      type="text"
      placeholder="Buscar por ID..."
      [(ngModel)]="filtroId"
      class="form-control"
      style="width: 20%; display: inline-block; margin-right: 1rem"
    />
    <input
      type="text"
      placeholder="Buscar por nombre..."
      [(ngModel)]="filtroNombre"
      class="form-control"
      style="width: 40%; display: inline-block; margin-right: 1rem"
    />
    <button class="btn btn-primary" (click)="filtrarTipos()">Buscar</button>
    <button class="btn btn-secondary" (click)="limpiarFiltro()">Limpiar</button>
  </div>

  <!-- Botón para crear nuevo tipo -->
  <div class="crear-tipo" style="text-align: center; margin-bottom: 2rem">
    <p>Si deseas crear un nuevo tipo de habitación <span style="font-size: 1.5rem">⬇️</span></p>
    <button class="btn btn-success" (click)="abrirModal()">Crear tipo de habitación</button>
  </div>

  <!-- Lista -->
  <div class="card mt-4">
    <div class="card-header">Lista de Tipos</div>
    <div class="card-body">
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tipo of tiposFiltrados">
            <td>{{ tipo.id }}</td>

            <td *ngIf="editando?.id !== tipo.id">{{ tipo.nombre }}</td>
            <td *ngIf="editando?.id === tipo.id">
              <input [(ngModel)]="editando!.nombre" />
            </td>

            <td *ngIf="editando?.id !== tipo.id">{{ tipo.descripcion }}</td>
            <td *ngIf="editando?.id === tipo.id">
              <textarea [(ngModel)]="editando!.descripcion"></textarea>
            </td>

            <td>
              <ng-container *ngIf="editando?.id !== tipo.id">
                <button class="btn btn-warning btn-sm" (click)="editarTipo(tipo)">Editar</button>
                <button class="btn btn-danger btn-sm" (click)="eliminarTipo(tipo.id)">
                  Eliminar
                </button>
              </ng-container>
              <ng-container *ngIf="editando?.id === tipo.id">
                <button class="btn btn-success btn-sm" (click)="guardarEdicion()">Guardar</button>
                <button class="btn btn-secondary btn-sm" (click)="cancelarEdicion()">
                  Cancelar
                </button>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal flotante -->
  <div class="modal" *ngIf="modalAbierto">
    <div class="modal-overlay" (click)="cerrarModal()"></div>
    <div class="modal-content">
      <h3>Nuevo Tipo de Habitación</h3>
      <form (ngSubmit)="crearTipo()">
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" [(ngModel)]="nuevoTipo.nombre" name="nombre" required />
        </div>
        <div class="form-group">
          <label>Descripción:</label>
          <textarea [(ngModel)]="nuevoTipo.descripcion" name="descripcion" required></textarea>
        </div>
        <div class="modal-buttons">
          <button type="submit" class="btn btn-success">Crear</button>
          <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
