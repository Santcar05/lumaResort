<!-- activities.component.html -->
<section class="activities-section">
  <div class="activities-header">
    <h2 class="section-title">ACTIVIDADES</h2>
    <h3 class="section-subtitle">Tenemos todo. <span>Lo que necesitas.</span></h3>
  </div>

  <div class="activities-container">
    <div class="activities-nav">
      <button
        *ngFor="let category of categories"
        class="nav-item"
        [class.active]="activeCategory === category.id"
        (click)="selectCategory(category.id)"
      >
        {{ category.nombre }}
      </button>
    </div>

    <!-- Carrusel de imágenes -->
    <div class="carousel-container">
      <div class="main-carousel">
        <div class="main-image-container">
          <img
            [src]="getCurrentCategory().images[selectedImageIndex]"
            [alt]="getCurrentCategory().title"
            class="main-image"
          />

          <!-- Información superpuesta en la imagen principal -->
          <div class="image-info-overlay">
            <div class="image-title">{{ getCurrentCategory().imageNames[selectedImageIndex] }}</div>
            <button class="btn" (click)="explorarServicio()">EXPLORAR</button>
          </div>

          <div class="thumbnail-container">
            <div
              *ngFor="let image of getCurrentCategory().images; let i = index"
              class="thumbnail-item"
              [class.active]="selectedImageIndex === i"
              (click)="selectImage(i)"
            >
              <img
                [src]="image"
                [alt]="getCurrentCategory().title + ' ' + (i + 1)"
                class="thumbnail-image"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de información debajo del carrusel -->
  </div>
</section>
