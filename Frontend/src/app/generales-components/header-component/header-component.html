<header>
  <nav>
    <!-- Menú -->
    <div class="menu-container" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
      <ul>
        <li class="PrimerLi">
          <a (click)="toggleMenu()">Menu</a>
          <ul class="dropdown" [class.show]="menuVisible">
            <li><a href="#">Idiomas</a></li>
            <li><a href="#">Tema Visual</a></li>
            <li><a href="#">Habitaciones</a></li>
            <li><a href="#">Restaurantes</a></li>
            <li><a [routerLink]="['/servicios']">Servicios</a></li>
          </ul>
        </li>
        <li><a routerLink="/">Inicio</a></li>
      </ul>
    </div>

    <!-- Nombre -->
    <div><h1 id="lumaResort">Luma Resort</h1></div>

    <!-- Contacto y Reservas -->
    <div>
      <ul>
        <li class="PrimerLi"><a href="#">Contacto</a></li>
        <li class="PrimerLi"><a [routerLink]="['/reservas']">Reservas</a></li>

        <li *ngIf="!isLoggedIn"><a [routerLink]="['/login']">Login</a></li>

        <ng-container *ngIf="isLoggedIn">
          <li><a (click)="togglePerfil()">Perfil</a></li>
          <ul class="dropdown" [class.show]="perfilVisible">
            <li><a href="#" [routerLink]="['/perfil', usuarioId]">Editar Perfil</a></li>
            <li><a (click)="verReservas()">Ver Reservas</a></li>
          </ul>
          <li><a (click)="logout()" style="cursor: pointer">Logout</a></li>
        </ng-container>
      </ul>
    </div>
  </nav>
</header>
