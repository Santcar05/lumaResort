<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${tipo.nombre}">Detalle Habitación</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/STYLES/generales.css" />
    <link rel="stylesheet" href="/STYLES/plantillas.css" />
    <link rel="stylesheet" href="/STYLES/detalle.css" />
  </head>
  <body>
    <div class="container">
      <!-- Título -->
      <h1 class="title" th:text="${tipo.nombre}">Nombre Habitación</h1>
      <p class="subtitle">Vista panorámica y comodidades premium</p>

      <!-- Galería -->
      <div class="gallery">
        <img
          src="https://assets.hyatt.com/content/dam/hyatt/hyattdam/images/2017/11/24/1240/Grand-Hyatt-Bogota-P001-King-Bedroom-View.jpg/Grand-Hyatt-Bogota-P001-King-Bedroom-View.16x9.jpg?imwidth=1920"
          alt="foto 1"
        />
        <img
          src="https://i.pinimg.com/474x/0a/0a/16/0a0a16ac750b4835308fbef6b7958ec6.jpg"
          alt="foto 2"
        />
        <img
          src="https://media.revistaad.es/photos/65c21a5605ba5d3cad2a23ba/16:9/w_2560%2Cc_limit/atr.royalmansion-bedroom2-mr.jpg"
          alt="foto 3"
        />
        <img
          src="https://s3.amazonaws.com/arc-wordpress-client-uploads/infobae-wp/wp-content/uploads/2019/05/20152251/Dorado-Beach-a-Ritz-Carlton-Reserve-3.jpg"
          alt="foto 4"
        />
      </div>

      <!-- Contenido principal -->
      <div class="content">
        <!-- Lado izquierdo -->
        <div>
          <div class="card">
            <h3>Descripción</h3>
            <p th:text="${tipo.descripcion}">
              Aquí va la descripción de la habitación.
            </p>
            <div class="tags">
              <span class="tag">Servicio Premiun Integrado</span>
              <span class="tag">Cama King</span>
              <span class="tag">Desayuno incluido</span>
              <span class="tag">WiFi</span>
            </div>
          </div>

          <div class="card">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-direction: row;
              "
            >
              <h3>Habitaciones disponibles</h3>
              <button class="btn-detalle action-btn">
                <a th:href=" @{/tipos/{id}/crearHabitacion(id=${tipo.id})}"
                  >Crear habitación</a
                >
              </button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Número</th>
                  <th>Precio</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="habitacion : ${habitaciones}">
                  <td th:text="${habitacion.idHabitacion}"></td>
                  <td th:text="${habitacion.numero}"></td>
                  <td th:text="${habitacion.precioPorNoche} + ' USD'"></td>
                  <td th:text="${habitacion.estado}"></td>
                  <td>
                    <button class="action-btn btn-detalle">
                      <a
                        th:href="@{/tipos/{tipoId}/editarHabitacion/{habitacionId}(tipoId=${tipo.id}, habitacionId=${habitacion.idHabitacion})}"
                      >
                        Editar
                      </a>
                    </button>
                    <button class="action-btn btn-detalle">
                      <a
                        th:href="@{/tipos/habitaciones/ver/{id}/borrar(id=${habitacion.idHabitacion})}"
                      >
                        Eliminar
                      </a>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Lado derecho -->
        <div class="sidebar_d">
          <div class="price-box">
            <p>Desde</p>
            <p class="price">$180/noche</p>
            <small>Impuestos no incluidos</small>
            <button class="btn-primary">Reservar ahora</button>
            <button class="btn-secondary">Agregar a favoritos</button>
          </div>
        </div>
      </div>

      <a th:href="@{/tipos}" class="back-btn">← Volver a lista</a>
    </div>
  </body>
</html>
