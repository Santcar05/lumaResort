<app-header-component></app-header-component>

<div class="login-background">
  <div class="overlay"></div>

  <div class="login-card animate-fade-in">
    <h2 class="title">{{ 'SIGNUP.TITLE' | translate }}</h2>
    <p class="subtitle">{{ 'SIGNUP.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onRegister()">
      <div class="input-group">
        <input
          type="text"
          [(ngModel)]="registerData.nombre"
          name="nombre"
          placeholder="{{ 'SIGNUP.FIRST_NAME_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="text"
          [(ngModel)]="registerData.apellido"
          name="apellido"
          placeholder="{{ 'SIGNUP.LAST_NAME_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="email"
          [(ngModel)]="registerData.correo"
          name="correo"
          placeholder="{{ 'SIGNUP.EMAIL_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="password"
          [(ngModel)]="registerData.contrasena"
          name="contrasena"
          placeholder="{{ 'SIGNUP.PASSWORD_PLACEHOLDER' | translate }}"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="text"
          [(ngModel)]="registerData.cedula"
          name="cedula"
          placeholder="{{ 'SIGNUP.ID_PLACEHOLDER' | translate }}"
        />
      </div>

      <div class="input-group">
        <input
          type="text"
          [(ngModel)]="registerData.telefono"
          name="telefono"
          placeholder="{{ 'SIGNUP.PHONE_PLACEHOLDER' | translate }}"
        />
      </div>

      <button type="submit" class="white-btn animate-pulse" [disabled]="loading">
        {{ loading ? ('SIGNUP.REGISTERING' | translate) : ('SIGNUP.SUBMIT' | translate) }}
      </button>
    </form>

    <!-- Mensaje de éxito -->
    <div *ngIf="successMsg && !loading" class="success-state">
      <div class="success-content">
        <h3>✅ {{ 'SIGNUP.SUCCESS_TITLE' | translate }}</h3>
        <p>{{ successMsg }}</p>
      </div>
    </div>

    <!-- Estado de error -->
    <div *ngIf="errorMsg && !loading" class="error-state">
      <div class="error-content">
        <div class="error-icon">⚠</div>
        <h3>{{ 'SIGNUP.ERROR_TITLE' | translate }}</h3>
        <p>{{ errorMsg }}</p>
      </div>
    </div>

    <p class="footer-text">
      {{ 'SIGNUP.ALREADY_HAVE_ACCOUNT' | translate }}
      <a routerLink="/login" class="link">{{ 'SIGNUP.SIGN_IN' | translate }}</a>
    </p>
  </div>
</div>
