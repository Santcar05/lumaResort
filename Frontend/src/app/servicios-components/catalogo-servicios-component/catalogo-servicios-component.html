<section id="catalogo-servicios">
  <img
    src="https://images.pexels.com/photos/1450353/pexels-photo-1450353.jpeg"
    alt="{{ 'SERVICES.CATALOG_IMAGE_ALT' | translate }}"
  />

  <div class="catalogo-content">
    <h2>{{ 'SERVICES.TITLE' | translate }}</h2>

    <p>{{ 'SERVICES.DESCRIPTION' | translate }}</p>

    <div *ngIf="loading" class="loading">Cargando servicios...</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <div class="servicios-grid" *ngIf="!loading && !error">
      <!-- Repeatable cards (solo los primeros 5) -->
      <div class="servicio-card" *ngFor="let card of servicesCards">
        <h3>{{ card.nombre | translate }}</h3>
        <p>{{ card.descripcion | translate }}</p>
        <a href="#" class="btn">{{ 'SERVICES.SEE_DETAILS' | translate }}</a>
      </div>
    </div>
  </div>
</section>
