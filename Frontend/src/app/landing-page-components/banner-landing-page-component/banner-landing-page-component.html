<section id="banner">
  <img
    src="https://images.pexels.com/photos/877962/pexels-photo-877962.jpeg"
    alt="{{ 'BANNER.IMAGE_ALT' | translate }}"
  />

  <div class="banner-content">
    <h1>{{ 'BANNER.TITLE' | translate }}</h1>
    <p>{{ 'BANNER.DESCRIPTION' | translate }}</p>
    <a [routerLink]="['/chatbot']" class="btn">{{ 'BANNER.MORE_INFO' | translate }}</a>
  </div>
</section>
