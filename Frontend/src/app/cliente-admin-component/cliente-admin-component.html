<div class="admin-container">
  <h2 class="titulo">Gestión de Clientes</h2>

  <!-- Crear nuevo cliente -->
  <div class="card">
    <div class="card-header">Nuevo Cliente</div>
    <div class="card-body">
      <form (ngSubmit)="crearCliente()">
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" [(ngModel)]="nuevoCliente.nombre" name="nombre" required />
        </div>
        <div class="form-group">
          <label>Apellido:</label>
          <input type="text" [(ngModel)]="nuevoCliente.apellido" name="apellido" required />
        </div>
        <div class="form-group">
          <label>Correo:</label>
          <input type="email" [(ngModel)]="nuevoCliente.correo" name="correo" required />
        </div>
        <div class="form-group">
          <label>Cédula:</label>
          <input type="text" [(ngModel)]="nuevoCliente.cedula" name="cedula" required />
        </div>
        <div class="form-group">
          <label>Teléfono:</label>
          <input type="text" [(ngModel)]="nuevoCliente.telefono" name="telefono" />
        </div>
        <button type="submit" class="btn btn-primary">Crear</button>
      </form>
    </div>
  </div>

  <!-- Lista de clientes -->
  <div class="card mt-4">
    <div class="card-header">Lista de Clientes</div>
    <div class="card-body">
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Correo</th>
            <th>Cédula</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes">
            <td>{{ cliente.idUsuario }}</td>

            <!-- Nombre -->
            <td *ngIf="editando?.idUsuario !== cliente.idUsuario">{{ cliente.nombre }}</td>
            <td *ngIf="editando?.idUsuario === cliente.idUsuario">
              <input [(ngModel)]="editando!.nombre" name="editNombre{{ cliente.idUsuario }}" />
            </td>

            <!-- Apellido -->
            <td *ngIf="editando?.idUsuario !== cliente.idUsuario">{{ cliente.apellido }}</td>
            <td *ngIf="editando?.idUsuario === cliente.idUsuario">
              <input [(ngModel)]="editando!.apellido" name="editApellido{{ cliente.idUsuario }}" />
            </td>

            <!-- Correo -->
            <td *ngIf="editando?.idUsuario !== cliente.idUsuario">{{ cliente.correo }}</td>
            <td *ngIf="editando?.idUsuario === cliente.idUsuario">
              <input [(ngModel)]="editando!.correo" name="editCorreo{{ cliente.idUsuario }}" />
            </td>

            <!-- Cedula -->
            <td *ngIf="editando?.idUsuario !== cliente.idUsuario">{{ cliente.cedula }}</td>
            <td *ngIf="editando?.idUsuario === cliente.idUsuario">
              <input [(ngModel)]="editando!.cedula" name="editCedula{{ cliente.idUsuario }}" />
            </td>

            <!-- Telefono -->
            <td *ngIf="editando?.idUsuario !== cliente.idUsuario">{{ cliente.telefono }}</td>
            <td *ngIf="editando?.idUsuario === cliente.idUsuario">
              <input [(ngModel)]="editando!.telefono" name="editTelefono{{ cliente.idUsuario }}" />
            </td>

            <!-- Rol -->
            <td>{{ cliente.rol }}</td>

            <td>
              <ng-container *ngIf="editando?.idUsuario !== cliente.idUsuario">
                <button class="btn btn-warning btn-sm" (click)="editarCliente(cliente)">
                  Editar
                </button>
                <button class="btn btn-danger btn-sm" (click)="eliminarCliente(cliente.idUsuario)">
                  Eliminar
                </button>
              </ng-container>
              <ng-container *ngIf="editando?.idUsuario === cliente.idUsuario">
                <button class="btn btn-success btn-sm" (click)="guardarEdicion()">Guardar</button>
                <button class="btn btn-secondary btn-sm" (click)="cancelarEdicion()">
                  Cancelar
                </button>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
